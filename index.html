ite;color:var(--forest2);border:0;border-radius:10px;padding:9px 12px;font-weight:850;font-size:12px}.checkline{display:flex;align-items:center;gap:8px;font-size:12px;color:#526258;margin:7px 0}.checkline:before{content:'✓';width:18px;height:18px;border-radius:50%;background:var(--mint);color:var(--forest);display:grid;place-items:center;font-weight:900}.hidden{display:none!important}.muted{color:var(--muted)}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf1ee;gap:12px}.settings-row:last-child{border:0}.settings-row strong{font-size:13px;display:block}.settings-row small{font-size:11px;color:var(--muted)}.settings-row button{flex:none}.file-input{display:none}.pill-counter{background:#eff4f0;border-radius:99px;padding:3px 7px;font-size:10px;color:#64736a;font-weight:800}.upcoming{background:#fff9e9;border:1px solid #f2e8c9;color:#806329;padding:10px 12px;border-radius:11px;font-size:11px}

<body>
<div class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark">↗</div><span>split<em>mate</em></span></div><div class="top-actions"><span class="tag">₹10/month Pro</span><button class="profile-chip" data-action="profile"><span class="avatar" id="topAvatar">Y</span><span class="profile-name" id="topName">You</span><span>⌄</span></button></div></header>
<div class="layout">
<aside class="sidebar"><div class="nav-label">Workspace</div><nav class="nav" id="sideNav"><button class="active" data-view="home"><span class="ico">⌂</span>Overview</button><button data-view="groups"><span class="ico">▦</span>Groups</button><button data-view="friends"><span class="ico">♧</span>Friends</button><button data-view="activity"><span class="ico">◷</span>Activity</button><button data-view="insights"><span class="ico">▥</span>Insights</button></nav><div class="sidebar-bottom"><div class="mini-pro"><b>Make money matters calmer.</b><p>Get reports, receipts and handy shortcuts for ₹10 a month.</p><button data-action="pro">Explore Pro</button></div><div class="nav" style="margin-top:10px"><button data-view="settings"><span class="ico">⚙</span>Settings & backup</button></div></div></aside>
<main class="main" id="main"></main>
</div>

<div class="modal-backdrop" id="modal"><section class="modal"><div class="modal-head"><div><h2 id="modalTitle">Add expense</h2><p id="modalDesc">Keep every shared cost in one place.</p></div><button class="close" id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div></section></div>

<script>
'use strict';
const DB_KEY='splitmate-local-v2';
const CATEGORIES={food:'🍽️',travel:'🚕',home:'🏠',groceries:'🛒',utilities:'💡',entertainment:'🎬',shopping:'🛍️',health:'💊',other:'✨'};
const money=(n)=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=(s)=>String(s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const today=()=>new Date().toISOString().slice(0,10);
const seed={profile:{name:'You',email:'',upi:''},groups:[{id:'g-flat',name:'Flatmates',emoji:'🏡',members:['You','Aisha','Rohan','Neha'],created:today(),defaults:{method:'equal',values:{}}},{id:'g-trip',name:'Weekend in Goa',emoji:'🌴',members:['You','Aisha','Kabir'],created:today(),defaults:{method:'equal',values:{}}}],friends:['Aisha','Rohan','Neha','Kabir'],expenses:[{id:'e1',groupId:'g-flat',description:'Monthly groceries',amount:2400,currency:'INR',paidBy:'Rohan',date:today(),category:'groceries',method:'equal',participants:['You','Aisha','Rohan','Neha'],shares:{You:600,Aisha:600,Rohan:600,Neha:600},note:'Demo expense',receipt:'',created:Date.now()-7200000},{id:'e2',groupId:'g-flat',description:'Electricity bill',amount:1800,currency:'INR',paidBy:'You',date:today(),category:'utilities',method:'equal',participants:['You','Aisha','Rohan','Neha'],shares:{You:450,Aisha:450,Rohan:450,Neha:450},note:'Demo expense',receipt:'',created:Date.now()-3600000},{id:'e3',groupId:'g-trip',description:'Airport cab',amount:1500,currency:'INR',paidBy:'Aisha',date:today(),category:'travel',method:'equal',participants:['You','Aisha','Kabir'],shares:{You:500,Aisha:500,Kabir:500},note:'Demo expense',receipt:'',created:Date.now()-1800000}],settlements:[],recurring:[],settings:{currency:'INR',simplify:true,hasSample:true}};
let db=loadDB(),view='home',activeGroup=null,activityQuery='',activityFilter='all',editingExpense=null,receiptData='',toastTimer;
function clone(o){return JSON.parse(JSON.stringify(o))}function loadDB(){try{const x=JSON.parse(localStorage.getItem(DB_KEY));return x&&x.groups?x:clone(seed)}catch{return clone(seed)}}function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function notify(msg){const el=document.getElementById('snackbar');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function groupById(id){return db.groups.find(g=>g.id===id)}function allPeople(g){return g?g.members:[...new Set(['You',...db.friends,...db.groups.flatMap(x=>x.members)])]}
function netBalances(groupId=null){const balances={};const expenses=db.expenses.filter(e=>!groupId||e.groupId===groupId);for(const e of expenses){balances[e.paidBy]=(balances[e.paidBy]||0)+Number(e.amount);for(const [p,v] of Object.entries(e.shares||{}))balances[p]=(balances[p]||0)-Number(v)}const settlements=db.settlements.filter(s=>!groupId||s.groupId===groupId);for(const s of settlements){balances[s.from]=(balances[s.from]||0)+Number(s.amount);balances[s.to]=(balances[s.to]||0)-Number(s.amount)}return balances}
function settlePlan(groupId=null){const b=netBalances(groupId),credit=[],debit=[];Object.entries(b).forEach(([name,n])=>{if(n>.005)credit.push({name,amount:n});else if(n<-.005)debit.push({name,amount:-n})});credit.sort((a,b)=>b.amount-a.amount);debit.sort((a,b)=>b.amount-a.amount);const out=[];let i=0,j=0;while(i<debit.length&&j<credit.length){const amt=Math.min(debit[i].amount,credit[j].amount);if(amt>.005)out.push({from:debit[i].name,to:credit[j].name,amount:amt});debit[i].amount-=amt;credit[j].amount-=amt;if(debit[i].amount<.005)i++;if(credit[j].amount<.005)j++}return out}
function netStatus(name,groupId=null){return netBalances(groupId)[name]||0}function friendUpi(name){return name===db.profile.name?(db.profile.upi||''):(db.profile.friendUpi?.[name]||'')}function upiPayButton(p){return p.from===db.profile.name&&friendUpi(p.to)?`<button class="text-link" data-action="upi-pay" data-to="${esc(p.to)}" data-amount="${p.amount}">Pay via UPI</button>`:''}function launchUpi(to,amount){const pa=friendUpi(to);if(!pa){notify('Add this friend’s UPI ID first.');return}const url='upi://pay?pa='+encodeURIComponent(pa)+'&pn='+encodeURIComponent(to)+'&am='+encodeURIComponent(Number(amount).toFixed(2))+'&cu=INR&tn='+encodeURIComponent('SplitMate settle-up');window.location.href=url;}
function totalOwed(){const b=netBalances();return Math.max(0,b[db.profile.name]||0)}function totalOwe(){const b=netBalances();return Math.max(0,-(b[db.profile.name]||0))}function allGroupPlans(){return db.groups.flatMap(g=>settlePlan(g.id).map(p=>({...p,groupId:g.id,groupName:g.name}))).filter(p=>p.from===db.profile.name||p.to===db.profile.name)}
function header(title,sub,action=''){return `<div class="content-head"><div><div class="eyebrow">SplitMate workspace</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function statCard(label,value,ico,cls='neutral'){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><strong class="${cls}">${money(value)}</strong></div>`}function statCount(label,value,ico){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><strong>${value}</strong></div>`}
function updateShell(){document.getElementById('topName').textContent=db.profile.name||'You';document.getElementById('topAvatar').textContent=initials(db.profile.name||'You');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
function render(){updateShell();const main=document.getElementById('main');if(view==='home')main.innerHTML=renderHome();else if(view==='groups')main.innerHTML=renderGroups();else if(view==='friends')main.innerHTML=renderFriends();else if(view==='activity')main.innerHTML=renderActivity();else if(view==='insights')main.innerHTML=renderInsights();else if(view==='settings')main.innerHTML=renderSettings();if(view==='insights')requestAnimationFrame(drawChart);}
function renderHome(){const recent=[...db.expenses].sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,5);const groups=db.groups.slice(0,5);const plan=allGroupPlans().slice(0,3);return `<div class="notice">Example groups and expenses are preloaded so you can try the app immediately. Go to Settings & backup → Clear all local data to start from scratch.</div><div class="welcome"><div><div class="eyebrow">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Hey ${esc((db.profile.name||'You').split(' ')[0])}, good to see you. <span style="font-size:25px">✦</span></h1><p>All your shared expenses, in one calm little place.</p></div><button class="btn btn-primary" data-action="expense">＋ Add an expense</button></div><div class="stats">${statCard('YOU ARE OWED',totalOwed(),'↗','positive')}${statCard('YOU OWE',totalOwe(),'↙','negative')}${statCard('NET BALANCE',totalOwed()-totalOwe(),'◈',totalOwed()-totalOwe()>=0?'positive':'negative')}</div><div class="grid-main"><div class="stack"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Your groups</h2><div class="panel-sub">Keep shared plans in one place</div></div><button class="text-link" data-action="group">＋ New group</button></div><div class="group-grid">${groups.length?groups.map(groupCard).join(''):`<div class="empty"><div class="empty-ico">👥</div>No groups yet. Create one to get started.</div>`}</div>${db.groups.length>5?`<button class="text-link" data-view="groups">View all ${db.groups.length} groups →</button>`:''}</section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Recent activity</h2><div class="panel-sub">The latest shared expenses</div></div><button class="text-link" data-view="activity">See all →</button></div>${recent.length?recent.map(expenseRow).join(''):`<div class="empty">No expenses yet. Add your first shared expense.</div>`}</section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Recurring expenses</h2><div class="panel-sub">Rent, subscriptions and bills you repeat</div></div><span class="pill-counter">${db.recurring.length} saved</span></div>${db.recurring.length?db.recurring.map(r=>`<div class="row"><div class="row-ico">🔁</div><div class="row-main"><strong>${esc(r.description)}</strong><small>${esc(groupById(r.groupId)?.name||'Group')} · ${esc(r.frequency)} · next ${esc(r.nextDate)}</small></div><div class="row-amount">${money(r.amount)}<button class="text-link" data-action="run-recurring" data-id="${r.id}">Add now</button></div></div>`).join(''):`<div class="empty">No recurring items yet. Choose a repeat schedule when adding an expense.</div>`}</section></div><div class="stack"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Settle up</h2><div class="panel-sub">Suggested payments to clear balances</div></div><span class="tag">${db.settings.simplify?'Simplified':'Direct'}</span></div>${plan.length?plan.map(p=>`<div class="row"><span class="avatar">${initials(p.from)}</span><div class="row-main"><strong>${esc(p.from)} <span class="muted">→</span> ${esc(p.to)}</strong><small>Suggested payment</small></div><div class="row-amount">${money(p.amount)}<button class="text-link" data-action="settle" data-from="${esc(p.from)}" data-to="${esc(p.to)}" data-amount="${p.amount}" data-group="${p.groupId}">Record</button>${upiPayButton(p)}</div></div>`).join(''):`<div class="empty">You're all caught up. No payments needed.</div>`}<button class="btn btn-light btn-small" style="width:100%;margin-top:12px" data-view="groups">View group balances</button></section><section class="panel pro-panel"><div class="eyebrow" style="color:#a9d6bb">SPLITMATE PRO</div><h2 style="font-size:20px;margin:8px 0 2px">A little more clarity, for less.</h2><p>Handy tools for people who split life together.</p><div class="price">₹10 <small>/ month · or ₹99/year</small></div><button data-action="pro">Explore Pro features</button></section><section class="panel"><div class="panel-head"><h2 class="panel-title">Quick tips</h2><span>🌱</span></div><div class="checkline">Add friends to groups before splitting costs</div><div class="checkline">Record cash or UPI repayments as settle-ups</div><div class="checkline">Export a backup so your data stays yours</div></section></div></div>`}
function groupCard(g){const bal=netStatus(db.profile.name,g.id);return `<div class="group-card" data-action="open-group" data-id="${g.id}"><div class="group-emoji">${esc(g.emoji||'👥')}</div><div class="group-info"><strong>${esc(g.name)}</strong><small>${g.members.length} members · ${db.expenses.filter(e=>e.groupId===g.id).length} expenses</small></div><div class="group-balance ${bal>=0?'positive':'negative'}">${bal>=0?'+':''}${money(bal)}</div></div>`}
function expenseRow(e){const g=groupById(e.groupId);return `<div class="row"><div class="row-ico">${CATEGORIES[e.category]||'✨'}</div><div class="row-main"><strong>${esc(e.description)}</strong><small>${esc(g?.name||'Personal')} · paid by ${esc(e.paidBy)} · ${new Date(e.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</small></div><div class="row-amount">${money(e.amount)}<small>${e.receipt?'📎 receipt · ':''}${e.method==='equal'?'Equal split':e.method}</small></div><button class="text-link" data-action="edit-expense" data-id="${e.id}">Edit</button></div>`}
function renderGroups(){return `${header('Your groups','Trips, homes, dinners and everything you share.','<button class="btn btn-primary" data-action="group">＋ Create group</button>')}<div class="stats">${statCount('TOTAL GROUPS',db.groups.length,'▦')}${statCount('TOTAL EXPENSES',db.expenses.length,'₹')}${statCount('ACTIVE FRIENDS',db.friends.length,'♧')}</div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">All groups</h2><div class="panel-sub">Select a group to view its balances and expenses</div></div></div><div class="group-grid">${db.groups.length?db.groups.map(g=>`<div class="group-card" data-action="group-detail" data-id="${g.id}"><div class="group-emoji">${esc(g.emoji||'👥')}</div><div class="group-info"><strong>${esc(g.name)}</strong><small>${g.members.length} members · Created ${esc(g.created||'')}</small></div><div class="group-balance ${netStatus(db.profile.name,g.id)>=0?'positive':'negative'}">${money(netStatus(db.profile.name,g.id))}</div><span>›</span></div>`).join(''):`<div class="empty">Create your first group to begin.</div>`}</div></section><div id="groupDetail"></div>`}
function renderFriends(){return `${header('Friends','People you share expenses with.','<button class="btn btn-primary" data-action="friend">＋ Add friend</button>')}<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Your friends</h2><div class="panel-sub">Balances shown across all your groups</div></div><span class="pill-counter">${db.friends.length} people</span></div>${db.friends.length?db.friends.map(name=>{const b=netStatus(name);return `<div class="balance-person"><span class="avatar">${initials(name)}</span><div class="row-main"><strong>${esc(name)}</strong><small>${b>.005?'owes you':b<-.005?'you owe':'settled up'}</small></div><div class="row-amount ${b>.005?'positive':b<-.005?'negative':''}">${money(Math.abs(b))}</div><button class="text-link" data-action="friend-edit" data-name="${esc(name)}">Edit</button></div>`}).join(''):`<div class="empty">No friends added yet.</div>`}</section><section class="panel"><div class="panel-head"><h2 class="panel-title">Invite friends</h2></div><p class="muted" style="font-size:12px">This offline preview stores data on this device. For now, export a group file and share it with friends. Real-time invites need the cloud sync service in the next release.</p><button class="btn btn-light" data-action="backup">Export my data</button></section>`}
function renderActivity(){const q=esc(activityQuery);const rows=[...db.expenses].sort((a,b)=>(b.created||0)-(a.created||0)).filter(e=>{const g=groupById(e.groupId);const matches=[e.description,e.paidBy,e.category,g?.name,e.note].join(' ').toLowerCase().includes(activityQuery.toLowerCase());return matches&&(activityFilter==='all'||e.category===activityFilter)});return `${header('Activity','Find, review and edit every shared expense.','')}<section class="panel"><div class="toolbar" style="margin-bottom:14px"><input class="search" id="activitySearch" placeholder="Search expenses, people or groups…" value="${q}"/><select class="select" id="activityCategory" style="width:auto;min-width:145px"><option value="all">All categories</option>${Object.keys(CATEGORIES).map(k=>`<option value="${k}" ${activityFilter===k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select><button class="btn btn-primary btn-small" data-action="expense">＋ Add expense</button></div><div id="activityRows">${rows.length?rows.map(expenseRow).join(''):`<div class="empty">No matching expenses.</div>`}</div></section>`}
function renderInsights(){const ex=db.expenses;const total=ex.reduce((s,e)=>s+Number(e.amount),0);const cats={};ex.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.amount));const order=Object.entries(cats).sort((a,b)=>b[1]-a[1]);return `${header('Insights','A simple picture of where shared money goes.','<button class="btn btn-light btn-small" data-action="csv">↓ Export CSV</button>')}<div class="stats">${statCard('TOTAL RECORDED',total,'₹')}${statCard('AVERAGE EXPENSE',ex.length?total/ex.length:0,'∅')}${statCard('EXPENSES LOGGED',ex.length,'◷')}</div><div class="grid-main"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Spending by category</h2><div class="panel-sub">Based on expenses stored on this device</div></div></div><div class="chart-wrap"><canvas id="catChart" aria-label="Spending by category chart"></canvas></div><div class="legend" id="chartLegend"></div></section><section class="panel"><div class="panel-head"><h2 class="panel-title">Category breakdown</h2></div>${order.length?order.map(([k,v])=>`<div class="row"><div class="row-ico">${CATEGORIES[k]||'✨'}</div><div class="row-main"><strong>${esc(k[0].toUpperCase()+k.slice(1))}</strong><small>${total?Math.round(v/total*100):0}% of spending</small></div><div class="row-amount">${money(v)}</div></div>`).join(''):`<div class="empty">Add expenses to see your spending insights.</div>`}</section></div>`}
function renderSettings(){return `${header('Settings & backup','Your details and your data, in your control.','')}<section class="panel"><div class="panel-head"><h2 class="panel-title">Your profile</h2><button class="btn btn-light btn-small" data-action="profile-edit">Edit profile</button></div><div class="balance-person"><span class="avatar">${initials(db.profile.name)}</span><div class="row-main"><strong>${esc(db.profile.name)}</strong><small>${esc(db.profile.email||'No email added')}</small></div></div></section><section class="panel"><div class="panel-head"><h2 class="panel-title">Expense preferences</h2></div><div class="settings-row"><div><strong>Default currency</strong><small>Used for new expenses</small></div><select class="select" style="width:auto" id="defaultCurrency" disabled><option value="INR" selected>₹ INR — Indian Rupee</option></select></div><div class="settings-row"><div><strong>Simplify group debts</strong><small>Suggest fewer payments without changing balances</small></div><input type="checkbox" id="simplifyToggle" ${db.settings.simplify?'checked':''}/></div></section><section class="panel"><div class="panel-head"><h2 class="panel-title">Backup & sharing</h2><span class="tag">Offline-first</span></div><p class="muted" style="font-size:12px;margin-top:0">Your current data is stored in this browser on this device. Export a backup before clearing browser data. You can import the same JSON on another device, but edits will not sync automatically.</p><div class="toolbar"><button class="btn btn-primary btn-small" data-action="backup">↓ Export full backup</button><button class="btn btn-light btn-small" data-action="import">↑ Import backup</button><button class="btn btn-light btn-small" data-action="csv">Export expenses CSV</button></div><div class="settings-row" style="margin-top:10px"><div><strong>Install SplitMate</strong><small>Add this app to your Android home screen from Chrome's menu</small></div><button class="btn btn-light btn-small" data-action="install">Install help</button></div></section><section class="panel"><div class="panel-head"><h2 class="panel-title">Premium plan</h2><span class="tag gold">Planned</span></div><div class="settings-row"><div><strong>SplitMate Pro</strong><small>₹10/month or ₹99/year · payment checkout not connected in this preview</small></div><button class="btn btn-soft btn-small" data-action="pro">View benefits</button></div></section><section class="panel"><div class="panel-head"><h2 class="panel-title">Local demo data</h2></div><p class="muted" style="font-size:12px">Remove the example groups and expenses to start fresh. This action cannot be undone unless you have exported a backup.</p><button class="btn btn-danger btn-small" data-action="clear-demo">Clear all local data</button></section>`}
function drawChart(){const canvas=document.getElementById('catChart');if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(300,rect.width*dpr);canvas.height=220*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const data={};db.expenses.forEach(e=>data[e.category]=(data[e.category]||0)+Number(e.amount));const entries=Object.entries(data).sort((a,b)=>b[1]-a[1]);const colors=['#176b4c','#79aa8b','#e0b45a','#d77865','#7898bf','#a5c7b3','#9a8eb9','#92a19a','#c5a17a'];if(!entries.length){ctx.fillStyle='#87958c';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('No spending data yet',rect.width/2,110);return}const max=Math.max(...entries.map(x=>x[1]));const chartH=155,base=177,barW=Math.min(36,(rect.width-60)/entries.length-10);entries.slice(0,8).forEach(([k,v],i)=>{const x=25+i*(barW+10),h=Math.max(4,v/max*chartH);ctx.fillStyle=colors[i%colors.length];ctx.beginPath();ctx.roundRect(x,base-h,barW,h,6);ctx.fill();ctx.fillStyle='#718178';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(k.slice(0,7),x+barW/2,195)});const leg=document.getElementById('chartLegend');if(leg)leg.innerHTML=entries.slice(0,8).map(([k],i)=>`<span><i class="dot" style="background:${colors[i%colors.length]}"></i>${esc(k)}</span>`).join('')}
function showModal(title,desc,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalDesc').textContent=desc||'';document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');receiptData=''}
function openGroupModal(){showModal('Create a group','Choose who you usually share expenses with.',`<form id="groupForm"><div class="field"><label>Group name</label><input class="input" name="name" placeholder="e.g. Goa trip, Flat 3B" required maxlength="50"></div><div class="field"><label>Pick an icon</label><select class="select" name="emoji"><option>🏡</option><option>🌴</option><option>✈️</option><option>🍽️</option><option>🎓</option><option>🎉</option><option>🚗</option><option>💼</option></select></div><div class="field"><label>Members (comma separated)</label><input class="input" name="members" placeholder="Aisha, Rohan, Neha"><small class="field-help">You will be added automatically. Existing friends can be reused.</small></div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">Create group</button></div></form>`)}
function openFriendModal(existing=''){showModal(existing?'Edit friend':'Add a friend','Add a person to your SplitMate circle.',`<form id="friendForm"><input type="hidden" name="old" value="${esc(existing)}"><div class="field"><label>Friend's name</label><input class="input" name="name" value="${esc(existing)}" placeholder="e.g. Aisha Khan" required></div><div class="field"><label>UPI ID (optional)</label><input class="input" name="upi" placeholder="name@bank" value="${esc(db.profile.friendUpi?.[existing]||'')}"><small class="field-help">Used only to prepare a UPI payment link. SplitMate does not process payments.</small></div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">Save friend</button></div></form>`)}
function openProfileModal(){showModal('Your profile','Set how your name appears in groups.',`<form id="profileForm"><div class="field"><label>Your name</label><input class="input" name="name" required value="${esc(db.profile.name)}"></div><div class="field"><label>Email (optional)</label><input class="input" name="email" type="email" value="${esc(db.profile.email||'')}"></div><div class="field"><label>Your UPI ID (optional)</label><input class="input" name="upi" value="${esc(db.profile.upi||'')}" placeholder="yourname@bank"></div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">Save profile</button></div></form>`)}
function openExpenseModal(exp=null,groupId=null){editingExpense=exp?.id||null;const g=groupById(exp?.groupId||groupId||activeGroup)||db.groups[0];if(!g){notify('Create a group before adding an expense.');openGroupModal();return}const people=g.members;const participants=exp?.participants||people;const payer=exp?.paidBy||db.profile.name;receiptData=exp?.receipt||'';showModal(exp?'Edit expense':'Add an expense','Tell SplitMate what was paid and how to split it.',`<form id="expenseForm"><div class="form-grid"><div class="field full"><label>What was it for?</label><input class="input" name="description" required maxlength="80" placeholder="e.g. Dinner, groceries, cab" value="${esc(exp?.description||'')}"></div><div class="field"><label>Amount</label><input class="input" type="number" min="0.01" step="0.01" name="amount" required placeholder="0.00" value="${exp?.amount??''}"></div><div class="field"><label>Currency</label><input type="hidden" name="currency" value="INR"><div class="field-help" style="padding:11px 0">Indian Rupees (INR)</div></div><div class="field"><label>Paid by</label><select class="select" name="paidBy">${people.map(p=>`<option ${p===payer?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input class="input" type="date" name="date" value="${esc(exp?.date||today())}" required></div><div class="field"><label>Group</label><select class="select" name="groupId" id="expenseGroup">${db.groups.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select class="select" name="category">${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${(exp?.category||'other')===k?'selected':''}>${v} ${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select></div><div class="field full"><label>Split with</label><div id="participantChecks" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px">${people.map(p=>`<label class="member-check"><input type="checkbox" name="participants" value="${esc(p)}" ${participants.includes(p)?'checked':''}>${esc(p)}</label>`).join('')}</div></div><div class="field full"><label>Split method</label><select class="select" name="method" id="splitMethod"><option value="equal" ${(exp?.method||g.defaults?.method||'equal')==='equal'?'selected':''}>Equally</option><option value="exact" ${(exp?.method||g.defaults?.method)==='exact'?'selected':''}>Exact amounts</option><option value="percentage" ${(exp?.method||g.defaults?.method)==='percentage'?'selected':''}>By percentage</option><option value="shares" ${(exp?.method||g.defaults?.method)==='shares'?'selected':''}>By shares</option></select><div class="field-help" id="splitHelp">The amount is divided evenly between selected members.</div><div id="splitInputs"></div></div><div class="field full"><label>Notes (optional)</label><textarea class="textarea" name="note" placeholder="Add a little context…">${esc(exp?.note||'')}</textarea></div><div class="field full"><label>Receipt photo (optional)</label><input class="input" id="receiptFile" type="file" accept="image/*"><div class="field-help" id="receiptStatus">${receiptData?'Receipt attached.':'Attach a receipt image. It stays on this device.'}</div></div><div class="field full"><label>Repeat this expense</label><select class="select" name="repeat"><option value="none">Does not repeat</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div></div><div class="modal-note">SplitMate calculates each person's share and updates the group balances automatically. All entries are saved locally on this device.</div><div class="modal-actions">${exp?'<button type="button" class="btn btn-danger" id="deleteExpense">Delete</button>':''}<button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">${exp?'Save changes':'Save expense'}</button></div></form>`);const form=document.getElementById('expenseForm');if(exp?.currency)form.currency.value=exp.currency;const groupSelect=document.getElementById('expenseGroup');groupSelect.addEventListener('change',()=>refreshParticipants(groupSelect.value));document.getElementById('splitMethod').addEventListener('change',renderSplitInputs);document.getElementById('participantChecks').addEventListener('change',renderSplitInputs);document.getElementById('receiptFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){notify('Please choose a receipt image under 2 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{receiptData=r.result;document.getElementById('receiptStatus').textContent='Receipt attached: '+f.name};r.readAsDataURL(f)});renderSplitInputs();if(exp){form.repeat.value='none'}const del=document.getElementById('deleteExpense');if(del)del.onclick=()=>{if(confirm('Delete this expense?')){db.expenses=db.expenses.filter(x=>x.id!==exp.id);save();closeModal();render();notify('Expense deleted')}}}
function refreshParticipants(groupId){const g=groupById(groupId);const wrap=document.getElementById('participantChecks');wrap.innerHTML=g.members.map(p=>`<label class="member-check"><input type="checkbox" name="participants" value="${esc(p)}" checked>${esc(p)}</label>`).join('');document.querySelector('#expenseForm [name="paidBy"]').innerHTML=g.members.map(p=>`<option>${esc(p)}</option>`).join('');renderSplitInputs()}
function getParticipantValues(){return [...document.querySelectorAll('#participantChecks input:checked')].map(x=>x.value)}
function renderSplitInputs(){const form=document.getElementById('expenseForm');if(!form)return;const method=form.method.value;const ppl=getParticipantValues();const wrap=document.getElementById('splitInputs'),help=document.getElementById('splitHelp');const previous={};wrap.querySelectorAll('input').forEach(i=>previous[i.dataset.person]=i.value);if(method==='equal'){wrap.innerHTML=`<div class="modal-note">${ppl.length||0} selected member(s) · shares are split evenly.</div>`;help.textContent='The total is split equally between everyone selected.';return}const symbol=method==='percentage'?'%':method==='shares'?'shares':'₹';help.textContent=method==='exact'?'Enter each person’s share. The total must match the expense amount.':method==='percentage'?'Enter percentages. They must add up to 100%.':'Enter each person’s share count.';wrap.innerHTML=ppl.map((p,i)=>`<div class="split-row"><span style="font-size:12px">${esc(p)}</span><input type="number" min="0" step="0.01" data-person="${esc(p)}" placeholder="${symbol}" value="${esc(previous[p]??(method==='percentage'? (100/(ppl.length||1)).toFixed(2):method==='shares'?'1':''))}"></div>`).join('')}
function openSettleModal(from='You',to='',amount='',groupId=null){const group=groupById(groupId)||db.groups.find(g=>g.members.includes(from)&&g.members.includes(to))||db.groups[0];if(!to){const p=settlePlan().find(x=>x.from==='You'||x.to==='You');if(p){from=p.from;to=p.to;amount=p.amount}}showModal('Record a settle-up','Log a cash or UPI payment made outside SplitMate.',`<form id="settleForm"><div class="form-grid"><div class="field"><label>Paid by</label><select class="select" name="from">${[...new Set(db.groups.flatMap(g=>g.members))].map(n=>`<option ${n===from?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Paid to</label><select class="select" name="to">${[...new Set(db.groups.flatMap(g=>g.members))].map(n=>`<option ${n===to?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Amount (₹)</label><input class="input" name="amount" type="number" min="0.01" step="0.01" required value="${amount||''}"></div><div class="field"><label>Date</label><input class="input" name="date" type="date" value="${today()}"></div><div class="field"><label>Payment method</label><select class="select" name="method"><option>UPI</option><option>Cash</option><option>Bank transfer</option><option>Other</option></select></div><div class="field"><label>Group</label><select class="select" name="groupId">${db.groups.map(g=>`<option value="${g.id}" ${g.id===group?.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">Record payment</button></div></form>`)}
function openPro(){showModal('SplitMate Pro','Extra clarity, at a tiny price.',`<div style="background:#eef7f0;border-radius:14px;padding:16px"><div style="font-size:29px;font-weight:900;color:var(--forest)">₹10 <span style="font-size:12px">/ month</span></div><div style="font-size:18px;font-weight:850">or ₹99 per year</div><div class="muted" style="font-size:11px">Pricing is the intended plan; checkout is not connected yet.</div></div><div style="padding:10px 2px">${['No daily expense cap','Receipt attachments and expense item notes','Category charts and spending insights','Expense search and CSV exports','Recurring expense reminders','Saved split defaults','Ad-free experience'].map(x=>`<div class="checkline">${esc(x)}</div>`).join('')}</div><div class="modal-note">This local preview does not collect payments or activate subscriptions. We'll connect an Indian payment gateway and verify subscriptions server-side before launch.</div><div class="modal-actions"><button class="btn btn-light" data-action="close">Close</button><button class="btn btn-primary" data-action="pro-interest">Notify me at launch</button></div>`)}
function showGroupDetail(id){const g=groupById(id);if(!g)return;activeGroup=id;const exp=db.expenses.filter(e=>e.groupId===id).sort((a,b)=>(b.created||0)-(a.created||0));const b=netBalances(id);const plan=settlePlan(id);document.getElementById('groupDetail')?.remove();const main=document.querySelector('#main');const d=document.createElement('section');d.className='panel';d.id='groupDetail';d.style.marginTop='18px';d.innerHTML=`<div class="panel-head"><div><div class="eyebrow">Group detail</div><h2 class="panel-title" style="font-size:20px">${esc(g.emoji)} ${esc(g.name)}</h2><div class="panel-sub">${g.members.length} members · ${exp.length} expenses</div></div><button class="close" data-action="close-detail">×</button></div><div class="toolbar" style="margin-bottom:14px"><button class="btn btn-primary btn-small" data-action="expense" data-group="${g.id}">＋ Add expense</button><button class="btn btn-light btn-small" data-action="group-share" data-id="${g.id}">Share group file</button><button class="btn btn-light btn-small" data-action="simplify" data-id="${g.id}">Simplify debts</button><button class="btn btn-light btn-small" data-action="group-default" data-id="${g.id}">Default split</button><button class="btn btn-light btn-small" data-action="group-edit" data-id="${g.id}">Edit group</button></div><h3 class="panel-title" style="margin:10px 0">Balances</h3>${g.members.map(p=>`<div class="balance-person"><span class="avatar">${initials(p)}</span><div class="row-main"><strong>${esc(p)}</strong><small>${(b[p]||0)>.005?'gets back':(b[p]||0)<-.005?'owes':'settled up'}</small></div><div class="row-amount ${(b[p]||0)>0?'positive':(b[p]||0)<0?'negative':''}">${money(Math.abs(b[p]||0))}</div></div>`).join('')}<h3 class="panel-title" style="margin:18px 0 8px">Suggested payments</h3>${plan.length?plan.map(p=>`<div class="row"><span class="avatar">${initials(p.from)}</span><div class="row-main"><strong>${esc(p.from)} → ${esc(p.to)}</strong><small>Suggested to settle the group</small></div><div class="row-amount">${money(p.amount)}<button class="text-link" data-action="settle" data-from="${esc(p.from)}" data-to="${esc(p.to)}" data-amount="${p.amount}" data-group="${g.id}">Record</button>${upiPayButton(p)}</div></div>`).join(''):'<div class="empty">No payments needed.</div>'}<h3 class="panel-title" style="margin:18px 0 8px">Group expenses</h3>${exp.length?exp.map(expenseRow).join(''):'<div class="empty">No expenses in this group yet.</div>'}`;main.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'start'})}
function exportBackup(groupId=null){const payload=groupId?{profile:db.profile,groups:db.groups.filter(g=>g.id===groupId),expenses:db.expenses.filter(e=>e.groupId===groupId),settlements:db.settlements.filter(s=>s.groupId===groupId),recurring:db.recurring.filter(r=>r.groupId===groupId),settings:db.settings,splitmateExport:true,version:2}:{...db,splitmateExport:true,version:2};download(`splitmate-${groupId?'group':'backup'}-${today()}.json`,JSON.stringify(payload,null,2),'application/json');notify('Backup exported.')}
function download(name,data,type){const blob=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function exportCsv(){const rows=[['Date','Group','Description','Category','Paid by','Amount','Currency','Split method','Participants','Note'],...db.expenses.map(e=>[e.date,groupById(e.groupId)?.name||'',e.description,e.category,e.paidBy,e.amount,e.currency||'INR',e.method,e.participants.join('; '),e.note||''])];download(`splitmate-expenses-${today()}.csv`,rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');notify('CSV exported.')}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.splitmateExport||!Array.isArray(x.groups)||!Array.isArray(x.expenses))throw Error('Invalid SplitMate backup');if(confirm('Import this backup? Current local data will be replaced.')){db={...clone(seed),...x,groups:x.groups,expenses:x.expenses,settlements:x.settlements||[],recurring:x.recurring||[],friends:x.friends||[...new Set(x.groups.flatMap(g=>g.members).filter(n=>n!==(x.profile?.name||'You')))],settings:{...seed.settings,...x.settings}};save();render();notify('Backup imported.')}}catch(e){notify('That file is not a valid SplitMate backup.')}};r.readAsText(file)}
function handleAction(btn){const a=btn.dataset.action;if(a==='expense')openExpenseModal(null,btn.dataset.group||null);if(a==='group')openGroupModal();if(a==='friend')openFriendModal();if(a==='profile'||a==='profile-edit')openProfileModal();if(a==='pro')openPro();if(a==='close')closeModal();if(a==='settle')openSettleModal(btn.dataset.from,btn.dataset.to,btn.dataset.amount,btn.dataset.group||null);if(a==='upi-pay')launchUpi(btn.dataset.to,btn.dataset.amount);if(a==='edit-expense'){const e=db.expenses.find(x=>x.id===btn.dataset.id);if(e)openExpenseModal(e)}if(a==='open-group'||a==='group-detail'){view='groups';render();showGroupDetail(btn.dataset.id)}if(a==='group-share')exportBackup(btn.dataset.id);if(a==='backup')exportBackup();if(a==='csv')exportCsv();if(a==='import')document.getElementById('importFile').click();if(a==='install')showModal('Install SplitMate','On Android, open this app in Chrome, tap ⋮ and choose “Add to Home screen” or “Install app”.',`<div class="modal-note">After the app is hosted on GitHub Pages or another HTTPS host, open its link in Chrome. You can then add it to your home screen. This creates an installable web app, not a standalone APK.</div><div class="modal-actions"><button class="btn btn-primary" data-action="close">Got it</button></div>`);if(a==='simplify'){const p=settlePlan(btn.dataset.id);showModal('Simplified debts','Suggested payments that preserve everyone’s final balance.',p.length?p.map(x=>`<div class="row"><div class="row-main"><strong>${esc(x.from)} pays ${esc(x.to)}</strong></div><div class="row-amount">${money(x.amount)}</div></div>`).join(''):'<div class="empty">No payments are required.</div>');}if(a==='group-edit')editGroup(btn.dataset.id);if(a==='group-default')openDefaultSplit(btn.dataset.id);if(a==='run-recurring')runRecurring(btn.dataset.id);if(a==='close-detail')document.getElementById('groupDetail')?.remove();if(a==='friend-edit')openFriendModal(btn.dataset.name);if(a==='pro-interest'){closeModal();notify('Thanks! Launch notifications will be added when accounts are ready.')}if(a==='clear-demo'){if(confirm('Permanently clear all local groups, expenses and friend data? Export a backup first if needed.')){db={profile:{name:'You',email:'',upi:''},groups:[],friends:[],expenses:[],settlements:[],recurring:[],settings:{currency:'INR',simplify:true,hasSample:false}};save();render();notify('Local data cleared.')}}}
function openDefaultSplit(id){const g=groupById(id);if(!g)return;const method=g.defaults?.method||'equal';showModal('Group default split','Choose the split method SplitMate should preselect for new group expenses.',`<form id="defaultSplitForm"><input type="hidden" name="groupId" value="${g.id}"><div class="field"><label>Default method for ${esc(g.name)}</label><select class="select" name="method"><option value="equal" ${method==='equal'?'selected':''}>Equal split</option><option value="exact" ${method==='exact'?'selected':''}>Exact amounts</option><option value="percentage" ${method==='percentage'?'selected':''}>Percentages</option><option value="shares" ${method==='shares'?'selected':''}>Shares</option></select></div><div class="modal-note">This saves a preferred split method. For each new expense you can still adjust the participants and amounts.</div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">Save default</button></div></form>`)}
function runRecurring(id){const r=db.recurring.find(x=>x.id===id);if(!r)return;db.expenses.push({id:uid(),groupId:r.groupId,description:r.description,amount:r.amount,currency:r.currency||'INR',paidBy:r.paidBy,date:today(),category:r.category,method:r.method,participants:r.participants,shares:r.shares,note:r.note||'Created from recurring expense',receipt:'',created:Date.now()});r.nextDate=advanceDate(r.nextDate||today(),r.frequency);save();render();notify('Recurring expense added.') }
function editGroup(id){const g=groupById(id);if(!g)return;showModal('Edit group','Change the group name or members.',`<form id="editGroupForm"><input type="hidden" name="id" value="${id}"><div class="field"><label>Group name</label><input class="input" name="name" required value="${esc(g.name)}"></div><div class="field"><label>Members (comma separated)</label><input class="input" name="members" value="${esc(g.members.filter(m=>m!==db.profile.name).join(', '))}"></div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close">Cancel</button><button class="btn btn-primary">Save group</button></div></form>`)}
function saveExpense(form){const fd=new FormData(form),g=groupById(fd.get('groupId')),ppl=getParticipantValues(),amount=Number(fd.get('amount')),method=fd.get('method');if(!g||!ppl.length||!amount||amount<=0){notify('Enter an amount and select at least one participant.');return}let shares={};if(method==='equal'){const base=Math.floor(amount*100/ppl.length)/100;let rem=Math.round((amount-base*ppl.length)*100)/100;ppl.forEach((p,i)=>shares[p]=+(base+(i===ppl.length-1?rem:0)).toFixed(2))}else{const inputs=[...document.querySelectorAll('#splitInputs input')];let vals=inputs.map(i=>({p:i.dataset.person,v:Number(i.value)}));if(vals.length!==ppl.length||vals.some(x=>!Number.isFinite(x.v)||x.v<0)){notify('Please enter a valid split for each selected member.');return}const total=vals.reduce((s,x)=>s+x.v,0);if(method==='percentage'){if(Math.abs(total-100)>.01){notify('Percentages must add up to 100%.');return}let rem=amount;vals.forEach((x,i)=>{const v=i===vals.length-1?rem:+(amount*x.v/100).toFixed(2);shares[x.p]=v;rem-=v})}else if(method==='exact'){if(Math.abs(total-amount)>.01){notify('Exact amounts must add up to the expense total.');return}vals.forEach(x=>shares[x.p]=x.v)}else{if(total<=0){notify('Shares must total more than zero.');return}let rem=amount;vals.forEach((x,i)=>{const v=i===vals.length-1?rem:+(amount*x.v/total).toFixed(2);shares[x.p]=v;rem-=v})}}
const existing=editingExpense?db.expenses.find(e=>e.id===editingExpense):null;const item={id:editingExpense||uid(),groupId:g.id,description:String(fd.get('description')).trim(),amount,currency:fd.get('currency'),paidBy:fd.get('paidBy'),date:fd.get('date'),category:fd.get('category'),method,participants:ppl,shares,note:fd.get('note'),receipt:receiptData,created:existing?.created||Date.now()};if(existing)db.expenses=db.expenses.map(e=>e.id===existing.id?item:e);else db.expenses.push(item);const repeat=fd.get('repeat');if(repeat!=='none'&&!existing)db.recurring.push({id:uid(),groupId:g.id,description:item.description,amount,currency:item.currency,paidBy:item.paidBy,date:item.date,category:item.category,method:item.method,participants:ppl,shares,note:item.note,frequency:repeat,nextDate:advanceDate(item.date,repeat)});save();closeModal();render();notify(existing?'Expense updated.':'Expense saved. Balances updated.')}
function advanceDate(d,f){const x=new Date(d+'T12:00:00');if(f==='weekly')x.setDate(x.getDate()+7);else if(f==='monthly')x.setMonth(x.getMonth()+1);else x.setFullYear(x.getFullYear()+1);return x.toISOString().slice(0,10)}
function bindForms(){document.getElementById('modalBody').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='groupForm'){const name=f.name.value.trim();const members=[db.profile.name,...f.members.value.split(',').map(x=>x.trim()).filter(Boolean)].filter((x,i,a)=>a.indexOf(x)===i);const g={id:uid(),name,emoji:f.emoji.value,members,created:today(),defaults:{method:'equal',values:{}}};db.groups.push(g);members.filter(x=>x!==db.profile.name).forEach(x=>{if(!db.friends.includes(x))db.friends.push(x)});save();closeModal();view='groups';render();showGroupDetail(g.id);notify('Group created.')}
if(f.id==='friendForm'){const name=f.name.value.trim(),old=f.old.value;if(!name)return;if(old&&old!==name){db.friends=db.friends.map(x=>x===old?name:x);db.groups.forEach(g=>g.members=g.members.map(x=>x===old?name:x));db.expenses.forEach(e=>{if(e.paidBy===old)e.paidBy=name;if(e.shares[old]!=null){e.shares[name]=e.shares[old];delete e.shares[old]}e.participants=e.participants.map(x=>x===old?name:x)})}if(!db.friends.includes(name))db.friends.push(name);if(!db.profile.friendUpi)db.profile.friendUpi={};if(f.upi.value)db.profile.friendUpi[name]=f.upi.value;save();closeModal();render();notify('Friend saved.')}
if(f.id==='profileForm'){const oldName=db.profile.name||'You';const newName=f.name.value.trim();db.profile.name=newName;db.profile.email=f.email.value.trim();db.profile.upi=f.upi.value.trim();db.groups.forEach(g=>{g.members=g.members.map(n=>n===oldName?newName:n);if(!g.members.includes(newName))g.members.unshift(newName)});db.expenses.forEach(e=>{if(e.paidBy===oldName)e.paidBy=newName;if(e.shares[oldName]!=null){e.shares[newName]=e.shares[oldName];delete e.shares[oldName]}e.participants=e.participants.map(n=>n===oldName?newName:n)});db.settlements.forEach(s=>{if(s.from===oldName)s.from=newName;if(s.to===oldName)s.to=newName});db.friends=db.friends.filter(n=>n!==oldName&&n!==newName);save();closeModal();render();notify('Profile updated.')}
if(f.id==='expenseForm')saveExpense(f);
if(f.id==='defaultSplitForm'){const g=groupById(f.elements.groupId.value);if(g){g.defaults={...(g.defaults||{}),method:f.method.value};save();closeModal();render();showGroupDetail(g.id);notify('Default split saved.')}}
if(f.id==='settleForm'){const data=Object.fromEntries(new FormData(f));const amt=Number(data.amount);if(data.from===data.to||amt<=0){notify('Choose two different people and a valid amount.');return}db.settlements.push({id:uid(),groupId:data.groupId,from:data.from,to:data.to,amount:amt,date:data.date,method:data.method});save();closeModal();render();notify('Settle-up recorded.')}
if(f.id==='editGroupForm'){const g=groupById(f.elements.namedItem('id').value);const members=[db.profile.name,...f.members.value.split(',').map(x=>x.trim()).filter(Boolean)].filter((x,i,a)=>a.indexOf(x)===i);g.name=f.name.value.trim();g.members=members;members.filter(x=>x!==db.profile.name).forEach(x=>{if(!db.friends.includes(x))db.friends.push(x)});save();closeModal();render();showGroupDetail(g.id);notify('Group updated.')}
});}
document.addEventListener('click',e=>{const viewBtn=e.target.closest('[data-view]');if(viewBtn){view=viewBtn.dataset.view;render();return}const actionBtn=e.target.closest('[data-action]');if(actionBtn){handleAction(actionBtn);return}});
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''});document.getElementById('main').addEventListener('input',e=>{if(e.target.id==='activitySearch'){activityQuery=e.target.value;const caret=e.target.selectionStart;const rows=document.getElementById('activityRows');if(rows){const list=[...db.expenses].sort((a,b)=>(b.created||0)-(a.created||0)).filter(x=>[x.description,x.paidBy,x.category,groupById(x.groupId)?.name,x.note].join(' ').toLowerCase().includes(activityQuery.toLowerCase())&&(activityFilter==='all'||x.category===activityFilter));rows.innerHTML=list.length?list.map(expenseRow).join(''):'<div class="empty">No matching expenses.</div>';const n=document.getElementById('activitySearch');n.focus();n.setSelectionRange(caret,caret)}}});document.getElementById('main').addEventListener('change',e=>{if(e.target.id==='activityCategory'){activityFilter=e.target.value;render()}if(e.target.id==='defaultCurrency'){db.settings.currency='INR';save();notify('SplitMate is currently configured for INR.')}if(e.target.id==='simplifyToggle'){db.settings.simplify=e.target.checked;save();render();notify('Preference saved.')}});window.addEventListener('resize',()=>{if(view==='insights')drawChart()});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();bindForms();
</script>
